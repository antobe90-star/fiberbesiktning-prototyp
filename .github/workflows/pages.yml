name: Publicera GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hämta kod
        uses: actions/checkout@v4
      - name: Konfigurera Pages
        uses: actions/configure-pages@v5
      - name: Ladda upp sajten
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
