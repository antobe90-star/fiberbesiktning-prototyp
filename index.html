  <style>
:root {
  --bg: #f3efe6;
  --paper: #fffcf6;
  --ink: #141714;
  --muted: #3a413c;
  --faint: #5c635e;
  --line: #c5bfb2;
  --line-strong: #8e887b;
  --brand: #123529;
  --brand-2: #1c5540;
  --ok: #0a4f2c;
  --ok-bg: #d5eedf;
  --bad: #7a1616;
  --bad-bg: #f5d4d4;
  --part: #0a3b5c;
  --part-bg: #d5e6f2;
  --open: #6a6e68;
  --shadow: 0 10px 40px rgba(20, 23, 20, 0.28);
  --tap: 52px;
  --radius: 16px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  height: 100vh;
  height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
}
button, input, textarea, select, label { font: inherit; color: inherit; }
button { appearance: none; border: 0; background: none; cursor: pointer; }
img { max-width: 100%; display: block; }

.app {
  position: fixed;
  inset: 0;
  width: auto;
  height: auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
}

.top { flex: 0 0 auto; padding: 6px 10px 8px; background: var(--brand); color: #f7f3ea; }
.banner { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.85; font-weight: 650; }
.top-row { display: flex; align-items: center; gap: 6px; min-height: 44px; }
.top h1 { font-size: clamp(15px, 4.4vw, 17px); margin: 0; font-weight: 700; line-height: 1.2; flex: 1; min-width: 0; }
.sub { font-size: 12px; opacity: 0.88; margin-top: 2px; }
.icon-btn {
  min-width: var(--tap); min-height: var(--tap); border-radius: 12px;
  color: #f7f3ea; font-weight: 700; font-size: 15px; padding: 0 8px;
}
.icon-btn:active { background: rgba(255,255,255,0.12); }
.icon-btn.ghost { border: 1px solid rgba(247,243,234,0.35); font-size: 13px; }

.scroll { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 24px; }
h2 { font-size: clamp(18px, 5.5vw, 22px); margin: 0 0 8px; }
p { margin: 0 0 12px; line-height: 1.45; }
.lead { color: var(--muted); font-size: 15px; }

.card {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin: 0 0 12px; width: 100%; text-align: left;
}
.card.tap { min-height: 72px; }
.card.tap:active { background: #f3eee4; }
.card-title { font-weight: 700; font-size: 17px; margin: 0 0 4px; }
.card-meta { color: var(--faint); font-size: 13px; line-height: 1.35; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chev { color: var(--faint); font-weight: 700; font-size: 22px; }

.btn {
  display: flex; align-items: center; justify-content: center; width: 100%;
  min-height: var(--tap); border-radius: 14px; padding: 12px 14px;
  font-weight: 700; font-size: 16px; border: 1px solid transparent;
}
.btn-primary { background: var(--brand); color: #f7f3ea; }
.btn-primary:active { background: #0c271e; }
.btn-secondary { background: var(--paper); border-color: var(--line-strong); }
.btn-secondary:active { background: #efeae0; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.btn-row.one { grid-template-columns: 1fr; }

.badge {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
}
.badge.open { background: #e2e4e0; color: var(--open); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.part { background: var(--part-bg); color: var(--part); }

/* Map */
.map-view { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
.map-wrap { flex: 1; min-height: 0; min-width: 0; position: relative; overflow: hidden; background: #d7e0c8; touch-action: none; }
.map-canvas { width: 100%; height: 100%; display: block; max-width: 100%; max-height: 100%; }
.map-tools {
  position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 3;
}
.map-tools button {
  width: 44px; height: 44px; border-radius: 12px; background: rgba(255,252,246,0.94);
  border: 1px solid var(--line); font-weight: 800; font-size: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.map-tools button:active { background: #efeae0; }
.map-banner {
  position: absolute; left: 10px; right: 64px; top: 10px; z-index: 3;
  background: rgba(18,53,41,0.94); color: #f7f3ea; border-radius: 12px; padding: 10px 12px;
  font-size: 14px; font-weight: 650; line-height: 1.3;
}
.map-legend {
  position: absolute; left: 10px; bottom: 10px; z-index: 3;
  background: rgba(255,252,246,0.94); border-radius: 12px; padding: 7px 10px;
  font-size: 11px; display: flex; gap: 8px; align-items: center; color: var(--muted);
  border: 1px solid var(--line);
}
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot.open { background: var(--open); }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--bad); }
.gps-chip {
  position: absolute; left: 8px; top: 8px; z-index: 3;
  background: rgba(255,252,246,0.94); border: 1px solid var(--line); border-radius: 12px;
  padding: 7px 10px; font-size: 12px; font-weight: 650; color: var(--muted);
  max-width: calc(100% - 62px);
}
.gps-bar {
  position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 4;
  display: flex; flex-wrap: wrap; gap: 6px;
}
.gps-bar button {
  flex: 1 1 auto;
  min-height: 44px; padding: 8px 10px; border-radius: 12px;
  background: rgba(255,252,246,0.96); border: 1px solid var(--line);
  font-weight: 700; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.gps-bar button.on { background: var(--brand); color: #f7f3ea; border-color: var(--brand); }
.gps-bar button.ghost { font-weight: 650; font-size: 12px; }
.hint-banner, .confirm-card {
  position: absolute; left: 8px; right: 8px; z-index: 5;
  background: var(--paper); border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 8px 28px rgba(20,23,20,.22); border: 1px solid var(--line);
}
.hint-banner { top: 8px; }
.confirm-card { bottom: 100px; }
.hint-banner p, .confirm-card p { margin: 0 0 10px; font-size: 14px; line-height: 1.4; }
.choice {
  display: block; width: 100%; text-align: left;
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line-strong);
  background: var(--paper); padding: 12px 14px; margin: 0 0 8px; font-weight: 700;
}
.choice small { display: block; font-weight: 500; font-size: 13px; color: var(--faint); margin-top: 2px; }
.choice.on { background: var(--brand); color: #f7f3ea; border-color: var(--brand); }
.choice.on small { color: rgba(247,243,234,0.85); }
.sub-btn {
  display: inline; background: none; color: inherit; opacity: 0.92;
  font-size: 12px; font-weight: 650; padding: 0; min-height: 0; min-width: 0;
  text-align: left; text-decoration: underline; text-underline-offset: 2px;
}

.dock {
  flex: 0 0 auto; padding: 8px 12px 10px; background: var(--bg);
  border-top: 1px solid var(--line); z-index: 8;
}
.fab {
  width: 100%; min-height: var(--tap); border-radius: 16px;
  background: var(--brand); color: #f7f3ea; font-weight: 800;
  font-size: clamp(16px, 4.5vw, 18px);
  box-shadow: 0 8px 22px rgba(18,53,41,.28);
}
.fab:active { background: #0c271e; }
.fab span { font-size: 24px; margin-right: 8px; line-height: 1; }

.sheet {
  flex: 0 1 auto;
  max-height: calc(100% - 76px);
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--paper);
  border-top: 1px solid var(--line);
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -8px 28px rgba(20,23,20,.14);
  padding: 8px 14px 12px;
  z-index: 7;
  min-height: 0;
  min-width: 0;
}
.sheet.handle { width: 42px; height: 4px; background: var(--line-strong); border-radius: 4px; margin: 4px auto 10px; }
.sheet h2 { font-size: 18px; margin: 0 0 2px; }
.sheet .meta { color: var(--faint); font-size: 13px; margin: 0 0 12px; }
.check-item { padding: 10px 0; border-top: 1px solid var(--line); }
.check-item p { margin: 0 0 8px; font-weight: 650; font-size: 15px; }
.seg-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.seg-3 button, .cats button, .chip {
  min-height: 44px; border-radius: 10px; border: 1px solid var(--line-strong);
  background: var(--paper); font-weight: 700; font-size: 13px; padding: 6px 8px;
}
.seg-3 button.on.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.seg-3 button.on.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.seg-3 button.on.na { background: #e2e4e0; border-color: var(--open); color: var(--open); }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 12px; }
.cats button.on { background: var(--brand-2); color: #f7f3ea; border-color: var(--brand-2); }
.field { margin: 0 0 12px; }
.field label { display: block; font-size: 13px; font-weight: 700; margin: 0 0 6px; }
.field textarea, .field input[type="text"] {
  width: 100%; border: 1px solid var(--line-strong); border-radius: 12px;
  padding: 10px 12px; background: #fff; min-height: 74px; resize: vertical;
}
.photo-box {
  display: flex; align-items: center; justify-content: center;
  min-height: 120px; border: 1.5px dashed var(--line-strong); border-radius: 14px;
  background: #fff; font-weight: 700; color: var(--brand); text-align: center; cursor: pointer;
  overflow: hidden; position: relative;
}
.photo-box input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photo-box img { width: 100%; height: 140px; object-fit: cover; }
.photo-box .hint { padding: 16px; font-size: 15px; }
.toast {
  position: absolute; left: 16px; right: 16px; bottom: 88px; z-index: 30;
  background: var(--brand); color: #f7f3ea; padding: 12px 14px; border-radius: 12px;
  font-weight: 650; text-align: center; pointer-events: none;
}
.list-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.list-item img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; }
.list-thumb { width: 56px; height: 56px; border-radius: 8px; background: #e8e4da; flex: 0 0 auto; }
.settings { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.settings button { min-height: 40px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--paper); font-weight: 650; font-size: 13px; }
.settings button.on { background: var(--brand); color: #f7f3ea; border-color: var(--brand); }
.protocol { background: #fff; padding: 16px; font-size: 13px; }
.protocol h2 { font-size: 18px; }
.protocol table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; }
.protocol th, .protocol td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; vertical-align: top; }
.protocol th { background: #f3efe6; }
.protocol img { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; }
@media (max-height: 560px) {
  :root { --tap: 44px; }
  .top { padding: 4px 8px 6px; }
  .top-row { min-height: 40px; }
  .scroll { padding: 10px 12px 16px; }
  .lead { font-size: 14px; }
  .map-tools button { width: 40px; height: 40px; }
  .dock { padding: 6px 10px 8px; }
}
@media print {
  body { background: #fff; overflow: auto; }
  .app { position: static; inset: auto; height: auto; overflow: visible; padding: 0; }
  .top, .dock, .no-print { display: none !important; }
  .scroll { overflow: visible; }
}
  </style>
</head>

  <script>

function fallbackDownload(blob, filename) {
  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = filename;
  a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    a.remove();
    URL.revokeObjectURL(url);
  }, 2000);
}
function deliverFile(blob, filename, mime) {
  let file = null;
  try { file = new File([blob], filename, { type: mime }); } catch (err) { file = null; }
  if (file && navigator.canShare) {
    try {
      if (navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: filename, text: "Fiberbesiktning" }).catch(function (err) {
          if (err && err.name === "AbortError") return;
          fallbackDownload(blob, filename);
        });
        return;
      }
    } catch (err) {}
  }
  fallbackDownload(blob, filename);
}

function atDist(pts, lens, dist) {
  const total = lens[lens.length - 1];
  const d = Math.max(0, Math.min(total, dist));
  let i = 1;
  while (i < lens.length && lens[i] < d) i += 1;
  const d0 = lens[i - 1], d1 = lens[i];
  const t = d1 === d0 ? 0 : (d - d0) / (d1 - d0);
  const x = pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t;
  const y = pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t;
  const ang = Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0]);
  return { x: x, y: y, ang: ang };
}
function chToDist(ch) { return (ch / MAP.chMax) * ROAD_LEN; }
function atCh(ch) { return atDist(ROAD_PTS, ROAD_LENS, chToDist(ch)); }
function offsetPt(pt, off) {
  return { x: pt.x + Math.cos(pt.ang + Math.PI / 2) * off, y: pt.y + Math.sin(pt.ang + Math.PI / 2) * off, ang: pt.ang };
}
function fiberAt(ch) { return offsetPt(atCh(ch), MAP.fiberOff); }
function fmtCh(ch) {
  const n = Math.max(0, Math.round(ch));
  const km = Math.floor(n / 1000);
  let rest = String(n % 1000);
  while (rest.length < 3) rest = "0" + rest;
  return km + "/" + rest;
}
function sampleRoad(off, stepCh) {
  const pts = [];
  for (let ch = 0; ch <= MAP.chMax; ch += (stepCh || 8)) {
    const p = off ? fiberAt(ch) : atCh(ch);
    pts.push([p.x, p.y]);
  }
  const end = off ? fiberAt(MAP.chMax) : atCh(MAP.chMax);
  pts.push([end.x, end.y]);
  return pts;
}
function polyPoints(pts) { return pts.map(function (p) { return p[0] + "," + p[1]; }).join(" "); }
function chFromXY(x, y) {
  let best = 0, bestD = Infinity;
  for (let ch = 0; ch <= MAP.chMax; ch += 2) {
    const p = fiberAt(ch);
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < bestD) { bestD = d; best = ch; }
  }
  return { ch: best, dist: bestD, p: fiberAt(best) };
}

function placed(o) {
  const p = fiberAt(o.ch);
  return Object.assign({}, o, { x: p.x, y: p.y });
}
function pointObjects() { return BASE_OBJECTS.map(placed); }
function stretches() {
  const pts = pointObjects();
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    out.push({
      id: "ST-" + a.id + "-" + b.id,
      type: "stracka",
      name: "Mellan " + a.id + " och " + b.id,
      fromId: a.id,
      toId: b.id,
      from: a.ch,
      to: b.ch,
      ch: (a.ch + b.ch) / 2,
      x: fiberAt((a.ch + b.ch) / 2).x,
      y: fiberAt((a.ch + b.ch) / 2).y
    });
  }
  return out;
}
function allTargets() { return pointObjects().concat(stretches()); }
function objById(id) {

function typeName(t) {
  return { brunn: "Brunn", skap: "Markskåp", nod: "Nod", fastighet: "Fastighetsanslutning", stracka: "Sträcka" }[t] || t;
}
function flanking(ch) {
  const pts = pointObjects();
  if (ch <= pts[0].ch) return { from: pts[0], to: pts[1] };
  if (ch >= pts[pts.length - 1].ch) return { from: pts[pts.length - 2], to: pts[pts.length - 1] };
  for (let i = 0; i < pts.length - 1; i++) {
    if (ch >= pts[i].ch && ch <= pts[i + 1].ch) return { from: pts[i], to: pts[i + 1] };
  }
  return { from: pts[0], to: pts[1] };
}

function objectInScope(type) {
  const omr = state.omrade || "bada";
  if (omr === "fiber") return type !== "stracka";
  if (omr === "schakt") return type === "stracka" || type === "brunn" || type === "skap";
  return true;
}
function itemsFor(type) {
  if (!objectInScope(type)) return [];
  return CHECK[type] || CHECK.stracka;
}

function targetStatus(id) {
  const obj = objById(id);
  if (!obj) return { kind: "open", label: "Ej besiktat" };
  const list = itemsFor(obj.type);
  const bag = state.answers[id] || {};
  let done = 0, bad = 0;
  list.forEach(function (it) {
    const o = bag[it.id];
    if (o) done += 1;
    if (o === "bad") bad += 1;
  });
  const remarks = remarksFor(id);
  const remarkBad = remarks.length;
  if (bad || remarkBad) return { kind: "bad", label: "Anmärkning", done: done, total: list.length, remarks: remarkBad };
  if (done && done === list.length) return { kind: "ok", label: "Klart", done: done, total: list.length, remarks: 0 };
  if (done) return { kind: "part", label: "Påbörjad", done: done, total: list.length, remarks: 0 };
  return { kind: "open", label: "Ej besiktat", done: done, total: list.length, remarks: 0 };
}
function remarksFor(id) {
  const obj = objById(id);
  return state.remarks.filter(function (r) {
    if (r.targetId === id) return true;
    if (obj && obj.type === "stracka") {
      return r.fromId === obj.fromId && r.toId === obj.toId;
    }
    return false;
  });
}
function statusColor(kind) {
  return { ok: "#0a4f2c", bad: "#7a1616", part: "#0a3b5c", open: "#6a6e68" }[kind] || "#6a6e68";
}

function esc(s) {

function fitTo(ch, scale) {
  const wrap = document.querySelector(".map-wrap");
  if (!wrap) return;
  const p = fiberAt(ch);
  state.scale = scale || state.scale || 1.9;
  state.tx = wrap.clientWidth / 2 - p.x * state.scale;
  state.ty = wrap.clientHeight / 2 - p.y * state.scale;
  state.fitted = true;
}
function keepGpsInView() {
  if (!state.follow) return;
  const wrap = document.querySelector(".map-wrap");
  if (!wrap) return;
  const p = fiberAt(state.gpsCh);
  const sx = p.x * state.scale + state.tx;
  const sy = p.y * state.scale + state.ty;
  const m = 70;
  let dx = 0, dy = 0;
  if (sx < m) dx = m - sx;
  if (sx > wrap.clientWidth - m) dx = wrap.clientWidth - m - sx;
  if (sy < m) dy = m - sy;
  if (sy > wrap.clientHeight - m) dy = wrap.clientHeight - m - sy;
  state.tx += dx;
  state.ty += dy;

function objectMark(o, col) {

      '<rect x="' + (x - 5) + '" y="' + (y - 5) + '" width="10" height="10" rx="1" fill="' + col + '"/>';
  } else if (o.type === "nod") {
    const r = 16;
    const pts = [];
    for (let i = 0; i < 6; i++) {

    shape = '<polygon points="' + x + "," + (y - 13) + " " + (x + 13) + "," + y + " " + x + "," + (y + 13) + " " + (x - 13) + "," + y + '" fill="#fff" stroke="' + col + '" stroke-width="3.5"/>';
  }

    '<circle cx="' + x + '" cy="' + y + '" r="' + hit + '" fill="transparent"/>' + shape + label + "</g>";
}

    ? ('<g>' +

      '<circle cx="' + state.confirmPin.x + '" cy="' + (state.confirmPin.y - 13) + '" r="4.5" fill="#fff"/>' +
      "</g>")
    : "";
  const gps = fiberAt(state.gpsCh);
  const accR = Math.max(metersToMap(state.gpsAccM || 8), 18);
  const gpsSvg = '<g id="gps">' +
    '<circle class="gps-acc" cx="' + gps.x + '" cy="' + gps.y + '" r="' + accR + '" fill="#1a73e8" fill-opacity="0.16" stroke="#1a73e8" stroke-width="1.2" stroke-opacity="0.5"/>' +
    '<circle class="gps-dot" cx="' + gps.x + '" cy="' + gps.y + '" r="8" fill="#1a73e8" stroke="#fff" stroke-width="3"/>' +
    "</g>";
  const wrap = document.querySelector(".map-wrap");
  const vw = Math.max(1, (wrap && wrap.clientWidth) ? wrap.clientWidth : 320);
  const vh = Math.max(1, (wrap && wrap.clientHeight) ? wrap.clientHeight : 240);
  state.wrapW = vw;
  state.wrapH = vh;
  const t = "translate(" + state.tx + " " + state.ty + ") scale(" + state.scale + ")";
  return '<svg id="ritning" class="map-canvas" viewBox="0 0 ' + vw + " " + vh + '" preserveAspectRatio="xMidYMid meet" width="100%" height="100%" role="img" aria-label="Karta">' +
    '<rect width="100%" height="100%" fill="#d7e0c8"/>' +
    '<g id="map-world" transform="' + t + '">' +
    '<polyline points="' + polyPoints(road) + '" fill="none" stroke="#b7b1a4" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<polyline points="' + polyPoints(road) + '" fill="none" stroke="#9a9588" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<polyline points="' + polyPoints(road) + '" fill="none" stroke="#efeae0" stroke-width="1.4" stroke-dasharray="8 10" stroke-linecap="round"/>' +
    houses + ticks + stretchSvg + objs + pins + pending + gpsSvg +
    "</g></svg>";
}

function render() {
  const root = document.getElementById("app");
  if (state.view === "start") root.innerHTML = viewStart();
  else if (state.view === "setup") root.innerHTML = viewSetup();
  else if (state.view === "overview") root.innerHTML = viewOverview();
  else if (state.view === "protocol") root.innerHTML = viewProtocol();
  else root.innerHTML = viewMap();
  if (state.view === "map") {
    bindMap();
    requestAnimationFrame(function () {
      const wrap = document.querySelector(".map-wrap");
      if (wrap && wrap.clientWidth && !state.fitted) {
        fitTo(state.gpsCh, wrap.clientHeight < 280 ? 1.15 : 1.7);
      }
      syncMapSize();
    });
  }
  const ta = document.getElementById("remark-text");
  if (ta) {
    ta.addEventListener("input", function () {
      if (state.draft) state.draft.text = ta.value;
    });
  }
}

function svgPointFromEvent(e) {
  const svg = document.getElementById("ritning");
  if (!svg) return null;
  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return null;
  const p = pt.matrixTransform(ctm.inverse());
  return { x: (p.x - state.tx) / state.scale, y: (p.y - state.ty) / state.scale };
}

function hitPointObject(x, y) {
  const r = hitRadiusMap();
  let best = null, bestD = r;
  pointObjects().forEach(function (o) {
    const d = Math.hypot(o.x - x, o.y - y);
    if (d <= bestD) { bestD = d; best = o; }
  });
  return best;
}
function hitTarget(x, y) {
  return hitPointObject(x, y);
}
function askRemarkAt(x, y) {
  const c = chFromXY(x, y);
  const fl = flanking(c.ch);
  state.confirmPin = {
    x: x, y: y, ch: c.ch,
    fromId: fl.from.id, toId: fl.to.id,
    label: "Sektion " + fmtCh(c.ch) + " · mellan " + fl.from.id + " och " + fl.to.id
  };
  state.sheet = null;
  state.selected = null;
  render();
}

function syncMapSize() {
  const wrap = document.querySelector(".map-wrap");
  const svg = document.getElementById("ritning");
  if (!wrap || !svg) return;
  const w = wrap.clientWidth, hgt = wrap.clientHeight;
  if (!w || !hgt) return;
  const prevW = state.wrapW || w, prevH = state.wrapH || hgt;
  if (prevW !== w || prevH !== hgt) {
    const gx = (prevW / 2 - state.tx) / state.scale;
    const gy = (prevH / 2 - state.ty) / state.scale;
    state.tx = w / 2 - gx * state.scale;
    state.ty = hgt / 2 - gy * state.scale;
  }
  state.wrapW = w;
  state.wrapH = hgt;
  svg.setAttribute("viewBox", "0 0 " + w + " " + hgt);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  const g = document.getElementById("map-world");
  if (g) g.setAttribute("transform", "translate(" + state.tx + " " + state.ty + ") scale(" + state.scale + ")");
}

function bindMap() {
  const canvas = document.getElementById("map-canvas");
  const svg = document.getElementById("ritning");
  if (!canvas || !svg) return;
  if (!state.fitted) {
    const short = (canvas.clientHeight || 400) < 280;
    fitTo(state.gpsCh, short ? 1.15 : 1.7);
  }
  syncMapSize();
  const pointers = new Map();
  let start = null;
  let pinch = null;

  canvas.addEventListener("pointerdown", function (e) {
    if (e.target.closest && e.target.closest(".map-tools, .map-banner, .gps-chip, .map-legend, .gps-bar, .hint-banner, .confirm-card, .dock, button, a, input, textarea, label")) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      pinch = {
        dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1,
        scale: state.scale,
        cx: (pts[0].x + pts[1].x) / 2,
        cy: (pts[0].y + pts[1].y) / 2
      };
      start = null;
      return;
    }
    start = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty, moved: false, id: e.pointerId };
  });
  canvas.addEventListener("pointermove", function (e) {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size >= 2) {
      const pts = Array.from(pointers.values());
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
      const target = pinch.scale * (dist / pinch.dist);
      const factor = target / state.scale;
      if (factor && isFinite(factor)) zoomAt(pinch.cx, pinch.cy, factor);
      return;
    }
    if (!start || e.pointerId !== start.id) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (Math.hypot(dx, dy) > 12) start.moved = true;
    if (state.placeMode) return;
    if (start.moved) {
      state.tx = start.tx + dx;
      state.ty = start.ty + dy;
      const g = document.getElementById("map-world");
      if (g) g.setAttribute("transform", "translate(" + state.tx + " " + state.ty + ") scale(" + state.scale + ")");
    }
  });
  function endPointer(e) {
    const wasPinch = !!pinch;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (!start || e.pointerId !== start.id) return;
    const wasMoved = start.moved;
    start = null;
    if (wasPinch || (wasMoved && !state.placeMode)) return;
    const p = svgPointFromEvent(e);
    if (!p) return;
    if (state.placeMode) {
      setDraftAt(p.x, p.y);
      state.placeMode = false;
      state.sheet = "remark";
      render();
      return;
    }
    const hit = e.target.closest && e.target.closest("[data-act='select'], [data-act='select-remark']");
    if (hit && hit.getAttribute("data-act") === "select-remark") {
      openRemark(hit.getAttribute("data-id"));
      return;
    }
    const obj = hitPointObject(p.x, p.y) || (hit && hit.getAttribute("data-act") === "select" ? objById(hit.getAttribute("data-id")) : null);
    if (obj && obj.type !== "stracka") {
      state.confirmPin = null;
      state.selected = obj.id;
      state.sheet = "check";
      render();
      return;
    }
    askRemarkAt(p.x, p.y);
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });
}

function zoomAt(cx, cy, factor) {
  const svg = document.getElementById("ritning");
  if (!svg) return;
  const pt = svg.createSVGPoint();
  pt.x = cx; pt.y = cy;
  const ctm = svg.getScreenCTM();
  if (!ctm) return;
  const p = pt.matrixTransform(ctm.inverse());
  const next = Math.max(0.8, Math.min(4.2, state.scale * factor));
  const wx = (p.x - state.tx) / state.scale;
  const wy = (p.y - state.ty) / state.scale;
  state.scale = next;
  state.tx = p.x - wx * next;
  state.ty = p.y - wy * next;
  const g = document.getElementById("map-world");
  if (g) g.setAttribute("transform", "translate(" + state.tx + " " + state.ty + ") scale(" + state.scale + ")");
}

function setDraftAt(x, y) {
  const c = chFromXY(x, y);
  const fl = flanking(c.ch);
  if (!state.draft) state.draft = { text: "", category: "ater", photo: "", photoName: "" };
  state.draft.x = x;
  state.draft.y = y;
  state.draft.ch = c.ch;
  state.draft.fromId = fl.from.id;
  state.draft.toId = fl.to.id;
  state.draft.targetId = "ST-" + fl.from.id + "-" + fl.to.id;
  const ll = mapXYToLatLon(x, y);
  state.draft.lat = ll.lat;
  state.draft.lon = ll.lon;
}

function tryRealGps() {
  if (!navigator.geolocation) {
    toast("Telefonen lämnar ingen position. Visar demon längs sträckan.");
    return;
  }
  toast("Hämtar position…");
  navigator.geolocation.getCurrentPosition(function (pos) {
    state.gpsSource = "real";
    state.gpsAccM = Math.max(4, pos.coords.accuracy || 8);
    state.gpsLat = pos.coords.latitude;
    state.gpsLon = pos.coords.longitude;
    toast("Riktig position sparas i anmärkningar och KMZ. Den blå pricken på ritningen följer fortfarande sträckan längs Höglandsvägen. ±" + Math.round(state.gpsAccM) + " m.");
    render();
  }, function () {
    state.gpsSource = "demo";
    state.gpsAccM = 8;
    state.gpsLat = null;
    state.gpsLon = null;
    toast("Kunde inte hämta GPS. Visar simulerad promenad i stället.");
    render();
  }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 15000 });
}

function startRemark(atGps) {
  const p = fiberAt(state.gpsCh);
  state.draft = { text: "", category: "ater", photo: "", photoName: "", x: p.x, y: p.y, ch: state.gpsCh };
  const fl = flanking(state.gpsCh);
  state.draft.fromId = fl.from.id;
  state.draft.toId = fl.to.id;
  state.draft.targetId = "ST-" + fl.from.id + "-" + fl.to.id;
  if (atGps && state.gpsSource === "real" && state.gpsLat != null && state.gpsLon != null) {
    state.draft.lat = state.gpsLat;
    state.draft.lon = state.gpsLon;
  } else {
    const ll = mapXYToLatLon(p.x, p.y);
    state.draft.lat = ll.lat;
    state.draft.lon = ll.lon;
  }
  state.placeMode = !atGps;
  state.sheet = atGps ? "remark" : null;
  state.selected = atGps ? state.draft.targetId : null;
  render();
}

function saveRemark() {
  const d = state.draft;
  if (!d || d.ch == null) { toast("Välj först ett läge på kartan."); return; }
  const ll = (d.lat != null && d.lon != null) ? { lat: d.lat, lon: d.lon } : mapXYToLatLon(d.x, d.y);
  const rec = {
    id: d.id && /^A-\d+$/.test(d.id) ? d.id : nextRemarkId(),
    x: d.x, y: d.y, ch: d.ch,
    lat: ll.lat,
    lon: ll.lon,
    category: d.category || "ovrigt",
    text: (d.text || "").trim(),
    photo: d.photo || "",
    photoName: d.photoName || "",
    photos: d.photos || undefined,
    fromId: d.fromId,
    toId: d.toId,
    targetId: d.targetId,
    status: d.status || "Registrerad",
    createdAt: d.createdAt || Date.now()
  };
  const existing = state.remarks.findIndex(function (x) { return x.id === rec.id; });
  if (existing >= 0) state.remarks[existing] = rec;
  else state.remarks.push(rec);
  state.draft = null;
  state.sheet = null;
  state.placeMode = false;
  state.selected = d.targetId;
  saveProject();
  toast("Anmärkningen " + rec.id + " är sparad.");
  render();
}

function openRemark(id) {
  const r = state.remarks.find(function (x) { return x.id === id; });
  if (!r) return;
  state.draft = Object.assign({}, r);
  state.sheet = "remark";
  state.selected = r.targetId;
  state.placeMode = false;
  render();
}

function readPhoto(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    if (!state.draft) return;
    state.draft.photo = reader.result;
    state.draft.photoName = file.name || "foto.jpg";
    const text = document.getElementById("remark-text");
    if (text) state.draft.text = text.value;
    render();
  };
  reader.readAsDataURL(file);
}

let walkTimer = null;
function tickWalk() {
  if (!state.walking) return;
  state.gpsCh = Math.min(MAP.chMax, state.gpsCh + 1.2);
  if (state.gpsCh >= MAP.chMax) state.walking = false;
  keepGpsInView();
  if (state.view === "map" && !state.sheet) {
    const g = document.getElementById("gps");
    if (g) {
      const p = fiberAt(state.gpsCh);
      g.querySelectorAll("circle").forEach(function (c, i) {
        c.setAttribute("cx", p.x);
        c.setAttribute("cy", p.y);
      });
    }
    const chip = document.querySelector(".gps-chip");
    if (chip) chip.textContent = (state.gpsSource === "real" ? "GPS" : "Demo") + " · sektion " + fmtCh(state.gpsCh) + " · ±" + Math.round(state.gpsAccM || 8) + " m";
    const world = document.getElementById("map-world");
    if (world) world.setAttribute("transform", "translate(" + state.tx + " " + state.ty + ") scale(" + state.scale + ")");
  } else if (state.view === "map") {
    render();
  }
  if (state.walking) walkTimer = setTimeout(tickWalk, 80);
}

document.getElementById("app").addEventListener("click", function (e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.getAttribute("data-act");
  if (act === "photo") return;
  if (act === "open") { openProject(t.getAttribute("data-id")); return; }
  if (act === "open-map") { openMap(); return; }
  if (act === "edit-scope") { state.walking = false; state.view = "setup"; render(); return; }
  if (act === "omrade") { state.omrade = t.getAttribute("data-id"); saveProject(); render(); return; }
  if (act === "back") {
    if (state.view === "map") { state.walking = false; state.view = "setup"; render(); }
    else if (state.view === "setup") { state.view = "start"; render(); }
    else { state.view = state.view === "protocol" ? "overview" : "map"; render(); }
    return;
  }
  if (act === "go") { state.view = t.getAttribute("data-view"); state.sheet = null; state.placeMode = false; state.confirmPin = null; render(); return; }
  if (act === "toggle-walk") {
    state.walking = !state.walking;
    state.follow = true;
    if (state.walking) {
      if (state.gpsCh >= MAP.chMax) state.gpsCh = 0;
      tickWalk();
    }
    render();
    return;
  }
  if (act === "center-gps") {
    state.follow = true;
    fitTo(state.gpsCh, Math.max(state.scale, 1.4));
    render();
    return;
  }
  if (act === "try-gps") { tryRealGps(); return; }
  if (act === "dismiss-hint") {
    try { localStorage.setItem(HINT_KEY, "1"); } catch (err) {}
    render();
    return;
  }
  if (act === "cancel-confirm") { state.confirmPin = null; render(); return; }
  if (act === "accept-confirm") {
    const c = state.confirmPin;
    if (!c) return;
    setDraftAt(c.x, c.y);
    state.draft.x = c.x;
    state.draft.y = c.y;
    state.confirmPin = null;
    state.sheet = "remark";
    render();
    return;
  }
  if (act === "zoom-in" || act === "zoom-out") {
    const wrap = document.getElementById("map-canvas");
    const r = wrap.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, act === "zoom-in" ? 1.2 : 1 / 1.2);
    return;
  }
  if (act === "new-remark") { startRemark(true); return; }
  if (act === "place-map") {
    const text = document.getElementById("remark-text");
    if (text && state.draft) state.draft.text = text.value;
    state.placeMode = true;
    state.sheet = null;
    render();
    return;
  }
  if (act === "cancel-place") { state.placeMode = false; state.sheet = "remark"; render(); return; }
  if (act === "close-sheet") { state.sheet = null; state.selected = null; state.draft = null; state.placeMode = false; render(); return; }
  if (act === "cat") {
    const text = document.getElementById("remark-text");
    if (text && state.draft) state.draft.text = text.value;
    if (state.draft) state.draft.category = t.getAttribute("data-id");
    render();
    return;
  }
  if (act === "save-remark") {
    const text = document.getElementById("remark-text");
    if (text && state.draft) state.draft.text = text.value;
    saveRemark();
    return;
  }
  if (act === "outcome") {
    const oid = t.getAttribute("data-obj");
    const iid = t.getAttribute("data-id");
    const val = t.getAttribute("data-val");
    if (!state.answers[oid]) state.answers[oid] = {};
    if (state.answers[oid][iid] === val) delete state.answers[oid][iid];
    else state.answers[oid][iid] = val;
    saveProject();
    render();
    return;
  }
  if (act === "set-typ") { state.typ = t.getAttribute("data-id"); saveProject(); render(); return; }
  if (act === "set-etapp") { state.etapp = t.getAttribute("data-id"); saveProject(); render(); return; }
  if (act === "goto-remark") {
    const r = state.remarks.find(function (x) { return x.id === t.getAttribute("data-id"); });
    if (!r) return;
    state.view = "map";
    state.sheet = null;
    state.selected = r.targetId;
    state.fitted = false;
    state.gpsCh = r.ch;
    render();
    requestAnimationFrame(function () { fitTo(r.ch, 2.1); state.sheet = "check"; render(); });
    return;
  }
  if (act === "goto-obj") {
    const id = t.getAttribute("data-id");
    const o = objById(id);
    state.view = "map";
    state.selected = id;
    state.sheet = "check";
    render();
    requestAnimationFrame(function () { if (o) fitTo(o.ch, 2.1); render(); });
    return;
  }
  if (act === "print") { window.print(); return; }
  if (act === "export-kmz") { exportKmz(); return; }
  if (act === "export-protocol-zip") { exportProtocolZip(); return; }
});

document.getElementById("app").addEventListener("change", function (e) {
  const t = e.target;
  if (t && t.getAttribute("data-act") === "photo" && t.files && t.files[0]) {
    const text = document.getElementById("remark-text");
    if (text && state.draft) state.draft.text = text.value;
    readPhoto(t.files[0]);
  }
});

window.addEventListener("resize", function () {
  if (state.view === "map") syncMapSize();
});
render();
  </script>
